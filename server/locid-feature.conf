# LociTerm config for the SK feature environment (skmud-feature laptop).
# Plain HTTP/ws on the tailnet (no TLS — the tailnet is the door);
# game-db disabled (single-MUD gateway, no public directory);
# game connection goes straight to merc on 2027 (LociTerm speaks its
# own telnet — no need to chain through MUDitM).

[locid]
log-file = /Users/mud/SKMUD/log/lociterm.log
vhost_name = localhost
mountpoint = /
origin = /Users/mud/SKMUD/src/externals/lociterm/dist/var/www/lociterm
default_doc = index.html

[ssl]

[client]
service = 4005
security = none
launcher = open

[game]
host = 127.0.0.1
service = 2027
security = none

[game-db]
engine = none
suggestions = open
min_protocol = none
